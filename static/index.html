<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skibeti37</title>
<script src="marked.min.js"></script>
<style>
  :root {
    --paper: #EFF1EC;
    --paper-raised: #E4E7E0;
    --sidebar: #E7E9E2;
    --ink: #1B2430;
    --ink-soft: #4B5563;
    --line: #D3D6CE;
    --accent: #1F7A63;
    --accent-soft: #E4F0EC;
    --amber: #B5722A;
    --amber-soft: #F5EBDD;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */

  #sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--line);
  }

  .sidebar-header h1 {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 2px;
  }

  .sidebar-header span {
    color: var(--ink-soft);
    font-size: 12px;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    background: var(--paper-raised);
    padding: 3px;
    border-radius: 7px;
  }

  .lang-btn {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    padding: 5px 0;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .lang-btn.active { background: var(--ink); color: var(--paper); }

  .sidebar-section {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #chats-section { flex: 1.3; }
  #docs-section { flex: 1; border-top: 1px solid var(--line); }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 6px;
  }

  .section-head h2 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 5px;
  }
  .icon-btn:hover { background: var(--paper-raised); color: var(--ink); }

  .scroll-list {
    overflow-y: auto;
    flex: 1;
    padding: 2px 8px 10px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .chat-item:hover { background: var(--paper-raised); }
  .chat-item.active { background: var(--ink); color: var(--paper); }
  .chat-item.active .chat-del { color: var(--paper); opacity: 0.6; }

  .chat-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-name-input {
    flex: 1;
    font-size: 13.5px;
    font-family: inherit;
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
    background: white;
    color: var(--ink);
  }

  .chat-del {
    background: none;
    border: none;
    color: var(--ink-soft);
    opacity: 0;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
  }
  .chat-item:hover .chat-del { opacity: 0.6; }
  .chat-del:hover { opacity: 1 !important; }

  .empty-hint {
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 10px 8px;
    line-height: 1.5;
  }

  /* Dokument-panel */

  .doc-item {
    padding: 8px 8px;
    border-radius: 7px;
    margin-bottom: 4px;
  }
  .doc-item:hover { background: var(--paper-raised); }

  .doc-row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }

  .doc-row input[type="checkbox"] {
    margin-top: 3px;
    accent-color: var(--accent);
  }

  .doc-del {
    background: none;
    border: none;
    color: var(--ink-soft);
    opacity: 0;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
  }
  .doc-item:hover .doc-del { opacity: 0.6; }
  .doc-del:hover { opacity: 1 !important; }

  .doc-name {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .doc-summary {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin: 3px 0 0 21px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #doc-status {
    font-size: 11.5px;
    color: var(--amber);
    padding: 4px 8px 8px;
    font-style: italic;
    min-height: 14px;
  }

  /* ---------- Hovedområde ---------- */

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .model-picker {
    display: flex;
    gap: 6px;
    background: var(--paper-raised);
    padding: 4px;
    border-radius: 8px;
  }

  .model-btn {
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 12.5px;
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .model-btn:hover { color: var(--ink); }
  .model-btn.active { background: var(--ink); color: var(--paper); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { margin-bottom: 26px; }
  .msg.user { display: flex; justify-content: flex-end; }

  .msg.user .bubble {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 14px 14px 3px 14px;
    max-width: 75%;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .msg.assistant .tag {
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
    display: block;
  }

  .msg.assistant .content { line-height: 1.65; font-size: 15.5px; max-width: 85%; }

  .thinking-block {
    border-left: 2px solid var(--amber);
    background: var(--amber-soft);
    padding: 10px 14px;
    margin: 10px 0;
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    color: #6B4A22;
    border-radius: 0 6px 6px 0;
    white-space: pre-wrap;
  }

  .content pre {
    background: var(--paper-raised);
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 13px;
  }
  .content pre code { background: none; padding: 0; }
  .content code {
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 13px;
    background: var(--paper-raised);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .content strong { font-weight: 600; }
  .content em { font-style: italic; }
  .content h1, .content h2, .content h3 {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-weight: 600;
    margin: 18px 0 8px;
    line-height: 1.3;
  }
  .content h1 { font-size: 20px; }
  .content h2 { font-size: 18px; }
  .content h3 { font-size: 16px; }
  .content ul, .content ol { margin: 8px 0; padding-left: 22px; }
  .content li { margin: 4px 0; }
  .content blockquote {
    border-left: 2px solid var(--line);
    margin: 10px 0;
    padding: 2px 14px;
    color: var(--ink-soft);
  }
  .content a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--line); }
  .content table { border-collapse: collapse; margin: 12px 0; font-size: 14px; width: 100%; }
  .content th, .content td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; }
  .content th { background: var(--paper-raised); font-weight: 600; }
  .content p { margin: 8px 0; }
  .content p:first-child { margin-top: 0; }

  #input-row { border-top: 1px solid var(--line); padding: 16px 32px 22px; }
  #input-form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }

  #input-field {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
  }
  #input-field:focus { outline: none; border-color: var(--accent); }
  #input-field:disabled { background: var(--paper-raised); color: var(--ink-soft); }

  #send-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-family: inherit;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  .status-line {
    font-family: Consolas, 'Cascadia Mono', 'SF Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    max-width: 760px;
    margin: 0 auto 8px;
    min-height: 14px;
  }

  .empty-state {
    color: var(--ink-soft);
    font-size: 14px;
    padding-top: 40px;
    text-align: center;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>Skibeti37</h1>
    <span>lokal modell-lab</span>
    <div class="lang-toggle" id="lang-toggle">
      <button class="lang-btn active" data-lang="no">Norsk</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
  </div>

  <div id="chats-section" class="sidebar-section">
    <div class="section-head">
      <h2>Samtaler</h2>
      <button class="icon-btn" id="new-chat-btn" title="Ny samtale">+ Ny</button>
    </div>
    <div class="scroll-list" id="chat-list">
      <div class="empty-hint">Ingen samtaler ennå.</div>
    </div>
  </div>

  <div id="docs-section" class="sidebar-section">
    <div class="section-head">
      <h2>Dokumenter</h2>
      <button class="icon-btn" id="add-doc-btn" title="Legg til fil">+ Legg til</button>
    </div>
    <div id="doc-status"></div>
    <div class="scroll-list" id="doc-list">
      <div class="empty-hint">Ingen dokumenter lagt til. Støtter .txt og .md.</div>
    </div>
  </div>
</div>

<div id="main">
  <header>
    <div class="model-picker" id="model-picker"></div>
  </header>

  <div id="chat">
    <div class="empty-state">Velg en modell over og skriv en melding for å starte.</div>
  </div>

  <div id="input-row">
    <div class="status-line" id="status-line"></div>
    <form id="input-form">
      <input id="input-field" type="text" placeholder="Skriv en melding..." autocomplete="off" />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
marked.setOptions({ breaks: true, gfm: true });

const MODEL_LABELS = {
  "Qwen2.5-1.5B": "1.5B · rask",
  "Qwen2.5-7B": "7B · standard",
  "DeepSeek-R1-7B": "R1 · resonnering",
};

let allModels = [];
let currentModel = null;
let currentChatId = null;   // null = ulagret, ny samtale
let currentChatName = null;
let currentLanguage = "no"; // "no" eller "en" - påvirker system-prompten
let conversation = [{ role: "system", content: systemPromptFor("no") }];
let isGenerating = false;

function systemPromptFor(lang) {
  if (lang === "en") {
    return "You are a helpful assistant. Always answer in English, regardless of what language the question is asked in. Think step by step when needed.";
  }
  return "Du er en hjelpsom assistent. Svar alltid på norsk, uansett hvilket språk spørsmålet er stilt på. Tenk steg for steg når det trengs.";
}

function setLanguage(lang) {
  currentLanguage = lang;
  conversation[0] = { role: "system", content: systemPromptFor(lang) };
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.onclick = async () => {
    setLanguage(btn.dataset.lang);
    if (currentChatId) await persistChat();
  };
});

const chatEl = document.getElementById("chat");
const pickerEl = document.getElementById("model-picker");
const statusEl = document.getElementById("status-line");
const formEl = document.getElementById("input-form");
const inputEl = document.getElementById("input-field");
const sendBtn = document.getElementById("send-btn");
const chatListEl = document.getElementById("chat-list");
const docListEl = document.getElementById("doc-list");
const docStatusEl = document.getElementById("doc-status");

function formatInline(text) {
  return marked.parse(text || "");
}

// ---------------- Modellvalg ----------------

async function loadModels() {
  allModels = await window.pywebview.api.list_models();
  pickerEl.innerHTML = "";
  allModels.forEach((name, i) => {
    const btn = document.createElement("button");
    btn.className = "model-btn" + (name === currentModel || (!currentModel && i === 0) ? " active" : "");
    btn.textContent = MODEL_LABELS[name] || name;
    btn.dataset.model = name;
    btn.onclick = () => selectModel(name);
    pickerEl.appendChild(btn);
  });
  if (!currentModel) currentModel = allModels[0];
}

function selectModel(name) {
  currentModel = name;
  [...pickerEl.children].forEach(btn => btn.classList.toggle("active", btn.dataset.model === name));
}

// ---------------- Samtaleliste ----------------

async function refreshChatList() {
  const chats = await window.pywebview.api.list_chats();
  chatListEl.innerHTML = "";

  if (chats.length === 0) {
    chatListEl.innerHTML = `<div class="empty-hint">Ingen samtaler ennå.</div>`;
    return;
  }

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");

    const nameSpan = document.createElement("span");
    nameSpan.className = "chat-name";
    nameSpan.textContent = chat.name;
    nameSpan.title = "Dobbeltklikk for å endre navn";
    nameSpan.ondblclick = (e) => {
      e.stopPropagation();
      startRename(item, nameSpan, chat);
    };

    const delBtn = document.createElement("button");
    delBtn.className = "chat-del";
    delBtn.textContent = "×";
    delBtn.title = "Slett samtale";
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      await window.pywebview.api.delete_chat(chat.id);
      if (chat.id === currentChatId) startNewChat();
      refreshChatList();
    };

    item.appendChild(nameSpan);
    item.appendChild(delBtn);
    item.onclick = () => openChat(chat.id);
    chatListEl.appendChild(item);
  });
}

function startRename(item, nameSpan, chat) {
  const input = document.createElement("input");
  input.className = "chat-name-input";
  input.value = chat.name;
  item.replaceChild(input, nameSpan);
  input.focus();
  input.select();

  const commit = async () => {
    const newName = input.value.trim() || chat.name;
    await window.pywebview.api.rename_chat(chat.id, newName);
    if (chat.id === currentChatId) currentChatName = newName;
    refreshChatList();
  };

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") { input.value = chat.name; input.blur(); }
  });
  input.addEventListener("blur", commit, { once: true });
}

async function openChat(chatId) {
  if (isGenerating) return;
  const data = await window.pywebview.api.load_chat(chatId);
  if (!data) return;

  currentChatId = data.id;
  currentChatName = data.name;
  conversation = data.messages;
  setLanguage(data.language || "no");
  if (data.model) selectModel(data.model);

  chatEl.innerHTML = "";
  let hasContent = false;
  for (const msg of conversation) {
    if (msg.role === "user") {
      addUserMessage(msg.content);
      hasContent = true;
    } else if (msg.role === "assistant") {
      const contentEl = addAssistantMessage(currentModel);
      contentEl.innerHTML = formatInline(msg.content);
      hasContent = true;
    }
  }
  if (!hasContent) {
    chatEl.innerHTML = `<div class="empty-state">Velg en modell over og skriv en melding for å starte.</div>`;
  }

  refreshChatList();
  refreshDocList();
}

function startNewChat() {
  if (isGenerating) return;
  currentChatId = null;
  currentChatName = null;
  setLanguage("no");
  conversation = [{ role: "system", content: systemPromptFor("no") }];
  chatEl.innerHTML = `<div class="empty-state">Velg en modell over og skriv en melding for å starte.</div>`;
  refreshChatList();
  refreshDocList();
}

document.getElementById("new-chat-btn").onclick = startNewChat;

async function persistChat() {
  if (!currentChatName) {
    const firstUser = conversation.find(m => m.role === "user");
    currentChatName = firstUser ? firstUser.content.slice(0, 45) : "Ny samtale";
  }
  const savedId = await window.pywebview.api.save_chat(
    currentChatId, currentChatName, currentModel, JSON.stringify(conversation), currentLanguage
  );
  currentChatId = savedId;
  refreshChatList();
}

// ---------------- Dokumenter ----------------

async function refreshDocList() {
  if (!currentChatId) {
    docListEl.innerHTML = `<div class="empty-hint">Denne samtalen har ingen dokumenter ennå. Trykk "+ Legg til" for å knytte et dokument hit (samtalen lagres automatisk).</div>`;
    return;
  }

  const docs = await window.pywebview.api.list_documents(currentChatId);
  docListEl.innerHTML = "";

  if (docs.length === 0) {
    docListEl.innerHTML = `<div class="empty-hint">Ingen dokumenter i denne samtalen. Støtter .txt og .md.</div>`;
    return;
  }

  docs.forEach(doc => {
    const item = document.createElement("div");
    item.className = "doc-item";

    const row = document.createElement("div");
    row.className = "doc-row";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = doc.active;
    checkbox.title = "Aktiv i samtalen";
    checkbox.onchange = async () => { await window.pywebview.api.toggle_document(currentChatId, doc.id); };

    const nameSpan = document.createElement("span");
    nameSpan.className = "doc-name";
    nameSpan.textContent = doc.filename;
    nameSpan.title = doc.filename;

    const delBtn = document.createElement("button");
    delBtn.className = "doc-del";
    delBtn.textContent = "×";
    delBtn.title = "Slett dokument";
    delBtn.onclick = async () => {
      await window.pywebview.api.delete_document(currentChatId, doc.id);
      refreshDocList();
    };

    row.appendChild(checkbox);
    row.appendChild(nameSpan);
    row.appendChild(delBtn);

    const summary = document.createElement("div");
    summary.className = "doc-summary";
    summary.textContent = doc.summary;
    summary.title = doc.summary;

    item.appendChild(row);
    item.appendChild(summary);
    docListEl.appendChild(item);
  });
}

document.getElementById("add-doc-btn").onclick = async () => {
  const addDocBtn = document.getElementById("add-doc-btn");

  // Dokumenter må høre til en samtale - opprett og lagre en tom samtale
  // automatisk hvis brukeren ikke har sendt noen melding ennå.
  if (!currentChatId) {
    currentChatName = currentChatName || "Ny samtale";
    currentChatId = await window.pywebview.api.save_chat(
      null, currentChatName, currentModel, JSON.stringify(conversation), currentLanguage
    );
    refreshChatList();
  }

  addDocBtn.disabled = true;
  inputEl.disabled = true;
  sendBtn.disabled = true;

  try {
    const result = await window.pywebview.api.add_document(currentChatId);
    if (result && !result.cancelled) {
      refreshDocList();
    }
  } finally {
    addDocBtn.disabled = false;
    inputEl.disabled = false;
    sendBtn.disabled = isGenerating;
    statusEl.textContent = "";
  }
};

// Kalles fra Python mens dokumentet blir oppsummert
function onDocStatus(text) {
  docStatusEl.textContent = text || "";
  statusEl.textContent = text || "";
}

// ---------------- Chat-visning ----------------

function clearEmptyState() {
  const empty = chatEl.querySelector(".empty-state");
  if (empty) empty.remove();
}

function addUserMessage(text) {
  clearEmptyState();
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addAssistantMessage(modelName) {
  clearEmptyState();
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<span class="tag">${MODEL_LABELS[modelName] || modelName}</span><div class="content"></div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div.querySelector(".content");
}

async function sendMessage(e) {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || isGenerating || !currentModel) return;

  inputEl.value = "";
  addUserMessage(text);
  conversation.push({ role: "user", content: text });

  isGenerating = true;
  sendBtn.disabled = true;
  statusEl.textContent = `genererer med ${currentModel}...`;

  const contentEl = addAssistantMessage(currentModel);
  const isReasoning = currentModel.includes("DeepSeek");

  window._streamState = {
    contentEl, isReasoning,
    tagEl: contentEl.previousElementSibling,
    rawBuffer: "", answerBuffer: "", thinkingEl: null, inThinking: false,
    tokenCount: 0, startTime: performance.now(),
  };

  try {
    await window.pywebview.api.send_message(currentModel, JSON.stringify(conversation), currentChatId);
  } catch (err) {
    contentEl.innerHTML += `<em>Feil: ${err}</em>`;
    isGenerating = false;
    sendBtn.disabled = false;
    statusEl.textContent = "";
  }
}

function onChunk(delta) {
  const s = window._streamState;
  s.rawBuffer += delta;
  s.tokenCount += 1;

  if (s.isReasoning) {
    if (s.rawBuffer.includes("<think>") && !s.inThinking && !s.thinkingEl) {
      s.inThinking = true;
      s.thinkingEl = document.createElement("div");
      s.thinkingEl.className = "thinking-block";
      s.contentEl.appendChild(s.thinkingEl);
    }
    if (s.inThinking) {
      if (s.rawBuffer.includes("</think>")) {
        s.inThinking = false;
        s.thinkingEl.textContent += delta.replace("</think>", "");
      } else {
        s.thinkingEl.textContent += delta.replace("<think>", "");
      }
    } else {
      s.answerBuffer += delta.replace("<think>", "").replace("</think>", "");
      let answerEl = s.contentEl.querySelector(".answer-text");
      if (!answerEl) {
        answerEl = document.createElement("div");
        answerEl.className = "answer-text";
        s.contentEl.appendChild(answerEl);
      }
      answerEl.innerHTML = formatInline(s.answerBuffer);
    }
  } else {
    s.answerBuffer += delta;
    s.contentEl.innerHTML = formatInline(s.answerBuffer);
  }

  chatEl.scrollTop = chatEl.scrollHeight;
}

async function onDone() {
  const s = window._streamState;
  conversation.push({ role: "assistant", content: s.answerBuffer });

  const elapsed = (performance.now() - s.startTime) / 1000;
  const speed = elapsed > 0 ? (s.tokenCount / elapsed) : 0;
  if (s.tagEl) {
    s.tagEl.textContent += ` · ${elapsed.toFixed(1)}s · ${speed.toFixed(1)} tok/s`;
  }

  isGenerating = false;
  sendBtn.disabled = false;
  statusEl.textContent = "";
  await persistChat();
}

function onError(message) {
  window._streamState.contentEl.innerHTML += `<em>Feil: ${message}</em>`;
  isGenerating = false;
  sendBtn.disabled = false;
  statusEl.textContent = "";
}

formEl.addEventListener("submit", sendMessage);

window.addEventListener("pywebviewready", async () => {
  await loadModels();
  await refreshChatList();
  await refreshDocList();
});
</script>
